name: 🐙 章鱼AI · 每日自动推送

on:
  schedule:
    # 每天北京时间 09:00 自动运行（UTC 01:00）
    # 09:00 推送 = 港股 09:30 开盘前送达，量化预测 / 概率 / 资金流动性栏目针对「今日盘中」
    - cron: "0 1 * * *"
    # 每天北京时间 21:00 晚间补充推送（收盘后复盘），取消注释即可生效
    # - cron: "0 13 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 量化引擎（21 只标的日线 + 沪深港通 + 港股成交）需要额外抓取时间
    # 声明仓库写入权限，解决git push 403问题
    permissions:
      contents: write

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🐙 运行章鱼AI流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -euo pipefail
          # 兜底空值，兼容定时触发场景
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：预览模式（不推送）"
            python3 output/pipeline.py --dry-run
          else
            python3 output/pipeline.py
          fi

      - name: 📤 提交生成的日报
        # 即使推送失败，只要文件生成了就提交
        if: always()
        run: |
          set -euo pipefail
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"

          # 通配符匹配失败不报错，兼容无日报文件的场景
          git add output/daily_report_*.html output/latest.html output/sentiment_history.json output/news_history.json output/quant_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            COMMIT_DATE=$(TZ='Asia/Macau' date +%Y-%m-%d)
            git commit -m "📰 自动日报 ${COMMIT_DATE}"
            git push origin HEAD
          fi
