name: 🐙 章鱼AI · 每日自动推送

on:
  schedule:
    # 每天北京时间 09:00 至 21:00 每两小时自动运行（对应 UTC 01:00、03:00、05:00、07:00、09:00、11:00、13:00，共 7 次）
    # 09:00 早盘前 + 21:00 晚间复盘：推送到微信
    # 11:00、13:00、15:00、17:00、19:00：盘中与盘后静默更新数据与网页（--no-push），不打扰微信
    - cron: "0 1-13/2 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false
      no_push:
        description: "仅更新数据与生成日报，不推送到微信"
        type: boolean
        default: false
        required: false
      llm_check:
        description: "只探活大模型 API（验证 Key / 端点 / 模型名，不生成日报）"
        type: boolean
        default: false
        required: false
      hk7_only:
        description: "只跑 AI 七日港股走势分析概率（研究模式，不推送）"
        type: boolean
        default: false
        required: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 量化引擎（21 只标的日线 + 沪深港通 + 港股成交）需要额外抓取时间
    # 声明仓库写入权限，解决git push 403问题
    permissions:
      contents: write

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🐙 运行章鱼AI流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 策略研判内的 MACD（无需密钥）：优先库 / 本次日线，缺项才取免费源。
          OCTOPUS_MACD: ${{ vars.OCTOPUS_MACD || '1' }}
          OCTOPUS_MACD_SYMBOLS: ${{ vars.OCTOPUS_MACD_SYMBOLS }}
          # ◧ AI 七日港股走势分析概率的大模型（默认 DeepSeek：https://api.deepseek.com + deepseek-flash）
          # 未配置 OCTOPUS_LLM_API_KEY → 该栏目整体缺席（不进审计），日报其它栏目照常
          # 想「没有 Key 也看量化基准」→ OCTOPUS_HK7_FALLBACK: "1"
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
          # 下面三个都可以留空：留空 = https://api.deepseek.com / deepseek-flash / auto（DeepSeek 关思考）
          OCTOPUS_LLM_BASE_URL: ${{ vars.OCTOPUS_LLM_BASE_URL }}
          OCTOPUS_LLM_MODEL: ${{ vars.OCTOPUS_LLM_MODEL }}
          OCTOPUS_LLM_THINKING: ${{ vars.OCTOPUS_LLM_THINKING }}
          # OCTOPUS_LLM_MAX_TOKENS: "2048"     # JSON 被截断时调大
          # OCTOPUS_LLM_TIMEOUT: "60"
          # OCTOPUS_HK7_FALLBACK: "1"
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          # 兜底空值，兼容定时触发场景
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          NO_PUSH="${{ github.event.inputs.no_push || 'false' }}"
          LLM_CHECK="${{ github.event.inputs.llm_check || 'false' }}"
          HK7_ONLY="${{ github.event.inputs.hk7_only || 'false' }}"

          CURRENT_HOUR=$(TZ='Asia/Shanghai' date +%H)

          # 只报「有没有配」，绝不回显 Key 本身
          if [ -n "${OCTOPUS_LLM_API_KEY:-}" ]; then
            echo "◧ 大模型：已配置 Key（${OCTOPUS_LLM_BASE_URL:-默认 https://api.deepseek.com} / ${OCTOPUS_LLM_MODEL:-默认 deepseek-flash}）"
          else
            echo "◧ 大模型：未配置 OCTOPUS_LLM_API_KEY → AI 七日港股走势分析概率整栏缺席"
          fi

          if [ "$LLM_CHECK" = "true" ]; then
            echo "运行模式：大模型 API 探活（不生成日报）"
            python3 output/pipeline.py --llm-check
          elif [ "$HK7_ONLY" = "true" ]; then
            echo "运行模式：只跑 AI 七日港股走势分析概率（研究模式，不推送）"
            python3 output/pipeline.py --hk7-only
          elif [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：预览模式（不推送）"
            python3 output/pipeline.py --dry-run
          elif [ "$NO_PUSH" = "true" ]; then
            echo "运行模式：手动指定静默更新（--no-push，不推微信）"
            python3 output/pipeline.py --no-push
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$CURRENT_HOUR" != "09" ] && [ "$CURRENT_HOUR" != "10" ] && [ "$CURRENT_HOUR" != "21" ] && [ "$CURRENT_HOUR" != "22" ]; then
            echo "运行模式：定时盘中静默更新（当前北京时间 ${CURRENT_HOUR} 时，不推微信，仅更新数据与网页）"
            python3 output/pipeline.py --no-push
          else
            echo "运行模式：全流程生成并推送微信（当前北京时间 ${CURRENT_HOUR} 时）"
            python3 output/pipeline.py
          fi

      - name: 📤 提交生成的日报
        # 即使推送失败，只要文件生成了就提交
        if: always()
        run: |
          set -euo pipefail
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"

          # 通配符匹配失败不报错，兼容无日报文件的场景
          # 留痕 JSON 必须一起提交，否则「预测留痕 / 命中率」每次都会从零开始：
          #   hk7_forecast.json    → ◧ AI 七日港股走势分析概率（满 7 个交易日结算）
          #   weekly_forecast.json → 🗓️ 每周量化走势预测（满 5 个交易日结算）
          git add output/daily_report_*.html output/latest.html output/sentiment_history.json output/news_history.json output/quant_history.json output/hk7_forecast.json output/weekly_forecast.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            COMMIT_TIME=$(TZ='Asia/Macau' date +'%Y-%m-%d %H:%M')
            git commit -m "📰 自动更新 ${COMMIT_TIME}"
            git push origin HEAD
          fi
