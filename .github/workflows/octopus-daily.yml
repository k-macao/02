      - name: 📤 提交生成的日报
        # 即使推送失败，只要文件生成了就提交
        if: always()
        run: |
          set -euo pipefail
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"

          # 通配符匹配失败不报错，兼容无日报文件的场景
          git add output/daily_report_*.html output/latest.html output/sentiment_history.json output/news_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            COMMIT_DATE=$(TZ='Asia/Macau' date +%Y-%m-%d)
            git commit -m "📰 自动日报 ${COMMIT_DATE}"
            git push origin HEAD
          fi
