name: 🐙 章鱼AI · 每日自动推送

on:
  # 每天北京时间 08:00 自动运行（UTC 00:00 = CST 08:00）
  schedule:
    - cron: "0 0 * * *"
    # 每天北京时间 21:00 晚间补充推送（美股盘中），启用直接取消注释即可
    # - cron: "0 13 * * *"

  # 手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🐙 运行章鱼AI流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -euo pipefail

          # 兼容定时/手动两种触发场景，空值自动兜底为 false
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：预览模式（不推送）"
            SCRIPT_ARGS="--dry-run"
          else
            echo "运行模式：正式推送模式"
            SCRIPT_ARGS=""
          fi

          # 脚本存在性前置校验，报错更明确
          SCRIPT_PATH="output/pipeline.py"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "❌ 错误：未找到脚本文件 $SCRIPT_PATH"
            exit 1
          fi

          python3 "$SCRIPT_PATH" $SCRIPT_ARGS

      - name: 📤 提交生成的日报
        if: always()
        run: |
          set -euo pipefail
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"

          # 匹配不到文件时不报错，兼容异常场景
          git add output/daily_report_*.html output/latest.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            COMMIT_DATE=$(TZ='Asia/Macau' date +%Y-%m-%d)
            git commit -m "📰 自动日报 $COMMIT_DATE"
            git push origin HEAD
          fi
