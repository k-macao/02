name: 🐙 章鱼AI · 每日自动推送

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🐙 运行章鱼AI流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -euo pipefail

          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：预览模式（不推送）"
            SCRIPT_ARGS="--dry-run"
          else
            echo "运行模式：正式推送模式"
            SCRIPT_ARGS=""
          fi

          python3 output/pipeline.py $SCRIPT_ARGS

      - name: 📤 提交生成的日报
        if: always()
        run: |
          set -euo pipefail
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"

          git add output/daily_report_*.html output/latest.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            COMMIT_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
            git commit -m "📰 自动日报 $COMMIT_DATE"
            git push origin HEAD
          fi
