name: 🐙 章鱼AI / 每日自动推送

on:
  # 每天北京时间 08:00 自动运行（UTC 00:00 = CST 08:00）
  schedule:
    - cron: "0 0 * * *"

  # 每天北京时间 21:00 晚间补充推送（美股盘中）
  # schedule:
  #   - cron: "0 13 * * *"

  # 手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          pip install --quiet requests

      - name: 🐙 运行章鱼AI流水线
        env:
          RE_TOKEN: ${{ secrets.RE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 output/pipeline.py --dry-run
          else
            python3 output/pipeline.py
          fi

      - name: 📤 提交生成的日报（可选）
        if: success()
        run: |
          git config user.name "octopus-bot"
          git config user.email "bot@octopus.ai"
          git add output/daily_report_*.html output/latest.html
          if git diff --cached --quiet; then
            echo "无新内容，跳过提交。"
          else
            git commit -m "📰 自动日报 $(TZ='Asia/Macau' date +%Y-%m-%d)"
            git push origin HEAD
          fi
