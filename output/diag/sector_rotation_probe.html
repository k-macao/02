<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔎 行业轮动数据源探测（浏览器直连东方财富）</title>
<style>
  body{margin:0;padding:24px 16px 64px;background:#F6F4EF;color:#101010;
       font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.75;}
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-size:19px;margin:0 0 6px;}
  .sub{color:#6B6B6B;font-size:12.5px;margin-bottom:20px;}
  .card{background:#fff;border:1px solid #DCD8CE;padding:16px 18px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 10px;}
  .kv{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
      white-space:pre-wrap;word-break:break-all;background:#F2F1EC;padding:8px 10px;}
  .ok{color:#0B7A3B;font-weight:700;} .bad{color:#B00020;font-weight:700;} .warn{color:#8A5A00;font-weight:700;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{border-bottom:1px solid #E3E0D8;padding:7px 8px;text-align:left;vertical-align:top;}
  th{background:#EFEDE6;font-weight:700;}
  code{background:#F2F1EC;padding:1px 4px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 行业轮动数据源探测</h1>
  <div class="sub">
    日报栏目「每日量化策略（行业轮动）」的数据来自东方财富行业板块指数。本页在你自己的浏览器里
    用 JSONP 直连东方财富接口，验证「取行业列表 → 取板块日 K」两步是否可用，并回传一份结果供核查。
    只读请求，不写任何数据。
  </div>

  <div class="card">
    <h2>1 · 行业板块列表（<code>clist</code>）</h2>
    <table><thead><tr><th style="width:42%">请求</th><th style="width:12%">结果</th><th>接口返回</th></tr></thead>
    <tbody id="list-rows"><tr><td colspan="3">探测中…</td></tr></tbody></table>
  </div>

  <div class="card">
    <h2>2 · 板块指数日 K（<code>kline</code>）</h2>
    <table><thead><tr><th style="width:34%">板块 / 口径</th><th style="width:12%">结果</th><th>日线情况</th></tr></thead>
    <tbody id="kline-rows"><tr><td colspan="3">等待列表探测…</td></tr></tbody></table>
  </div>

  <div class="card">
    <h2>3 · 结论</h2>
    <div class="kv" id="verdict">探测中…</div>
  </div>

  <div class="card">
    <h2>4 · 原始结果（可复制给我）</h2>
    <div class="kv" id="raw">—</div>
  </div>
</div>

<script>
const LIST_URL = "https://push2.eastmoney.com/api/qt/clist/get";
const KLINE_URL = "https://push2his.eastmoney.com/api/qt/stock/kline/get";
const TIMEOUT_MS = 12000;

function jsonp(url, params, timeout = TIMEOUT_MS) {
  return new Promise((resolve) => {
    const cb = "__octo_cb_" + Math.random().toString(36).slice(2) + "_" + Date.now();
    const script = document.createElement("script");
    let done = false;
    const finish = (payload) => {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      script.remove();
      resolve(payload);
    };
    window[cb] = (data) => finish({ ok: true, data });
    script.onerror = () => finish({ ok: false, error: "脚本加载失败（网络/被拦截/接口拒绝）" });
    const timer = setTimeout(() => finish({ ok: false, error: `超时 ${timeout}ms（回调未触发）` }), timeout);
    const qs = Object.entries({ ...params, cb })
      .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");
    script.src = url + "?" + qs;
    document.head.appendChild(script);
  });
}

function summarizeList(data) {
  const root = (data && data.data) || {};
  const diff = root.diff;
  const items = Array.isArray(diff) ? diff
    : (diff && typeof diff === "object" ? Object.values(diff) : []);
  const codes = items.map((it) => it && it.f12).filter(Boolean).map(String);
  return {
    total: root.total === undefined ? null : root.total,
    diffType: Array.isArray(diff) ? "list" : (diff && typeof diff === "object" ? "dict" : typeof diff),
    count: items.length,
    complete: root.total === undefined ? null : (Number(root.total) <= items.length),
    sample: items.slice(0, 3).map((it) => `${it.f12} ${it.f14}`).join(" / "),
    codes,
  };
}

function summarizeKline(data) {
  const root = (data && data.data) || {};
  const lines = Array.isArray(root.klines) ? root.klines : [];
  const last = lines.length ? String(lines[lines.length - 1]).split(",") : null;
  const first = lines.length ? String(lines[0]).split(",") : null;
  return { name: root.name || null, count: lines.length,
           first: first ? first[0] : null, last: last ? last[0] : null,
           lastClose: last ? last[2] : null };
}

const LIST_VARIANTS = [
  { label: "① 现行参数 pz=500（改版前）",
    params: { pn: "1", pz: "500", po: "1", np: "1", fltt: "2", invt: "2", fid: "f12", fs: "m:90+t:2", fields: "f12,f14" } },
  { label: "② 新版分页 pz=100",
    params: { pn: "1", pz: "100", po: "1", np: "1", fltt: "2", invt: "2", fid: "f12", fs: "m:90+t:2", fields: "f12,f14" } },
  { label: "③ pz=100 不带 fltt/invt",
    params: { pn: "1", pz: "100", po: "1", np: "1", fid: "f12", fs: "m:90+t:2", fields: "f12,f14" } },
];

const report = { page_at: new Date().toISOString(), ua: navigator.userAgent, list: [], klines: [] };

function row(tbodyId, cells, cls) {
  const tbody = document.getElementById(tbodyId);
  if (tbody.dataset.ready !== "1") { tbody.innerHTML = ""; tbody.dataset.ready = "1"; }
  const tr = document.createElement("tr");
  cells.forEach((c, i) => {
    const td = document.createElement("td");
    if (i === 1 && cls) td.className = cls;
    td.textContent = c;
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
}

(async function main() {
  let codes = [];
  for (const variant of LIST_VARIANTS) {
    const res = await jsonp(LIST_URL, variant.params);
    if (!res.ok) {
      report.list.push({ ...variant, ok: false, error: res.error });
      row("list-rows", [variant.label, "❌ 失败", res.error], "bad");
      continue;
    }
    const s = summarizeList(res.data);
    report.list.push({ ...variant, ok: true, ...s, codes: s.codes.slice(0, 8) });
    row("list-rows", [variant.label, s.count ? "✅ 成功" : "⚠️ 空", s.count ? "✅ 成功" : "⚠️ 空"], s.count ? "ok" : "warn");
    row("list-rows", ["", "", `total=${s.total} · diff=${s.diffType}(${s.count}) · 完整=${s.complete} · 样本：${s.sample || "无"}`]);
    if (!codes.length && s.codes.length) codes = s.codes;
  }

  if (!codes.length) {
    row("kline-rows", ["—", "⚠️ 跳过", "行业列表未取到，无法探测日 K"], "warn");
    finish();
    return;
  }

  const sample = codes.slice(0, 6);
  for (const code of sample) {
    for (const fqt of ["1", "0"]) {
      const params = { secid: "90." + code, klt: "101", fqt, lmt: "180", end: "20500101",
                       fields1: "f1,f2,f3,f4,f5,f6", fields2: "f51,f52,f53,f54,f55,f56" };
      const res = await jsonp(KLINE_URL, params);
      const label = `${code} · fqt=${fqt}${fqt === "1" ? "（前复权）" : "（不复权）"}`;
      if (!res.ok) {
        report.klines.push({ code, fqt, ok: false, error: res.error });
        row("kline-rows", [label, "❌ 失败", res.error], "bad");
        continue;
      }
      const s = summarizeKline(res.data);
      report.klines.push({ code, fqt, ok: true, ...s });
      const enough = s.count >= 66;
      row("kline-rows", [label, s.count ? "✅ 成功" : "⚠️ 空", s.count ? "✅ 成功" : "⚠️ 空"], s.count ? "ok" : "warn");
      row("kline-rows", ["", "", `${s.name || ""} · 日线 ${s.count} 根（评分需 ≥66）${enough ? " ✅" : " ⚠️"} · ${s.first || "—"} → ${s.last || "—"} · 末收盘 ${s.lastClose || "—"}`]);
      if (s.count) break;   // 该板块已取到日线，不再试另一种口径
    }
  }
  finish();

  function finish() {
    const okList = report.list.filter((r) => r.ok && r.count);
    const okKline = report.klines.filter((r) => r.ok && r.count);
    const fqtUsed = [...new Set(okKline.map((r) => r.fqt))];
    const lastDates = [...new Set(okKline.map((r) => r.last))];
    const lines = [
      `行业列表：${okList.length ? `✅ 可用（完整=${okList[0].complete}，${okList[0].count}/${okList[0].total} 个）` : "❌ 全部失败/为空 → 栏目会因「行业列表不完整」缺席"}`,
      `板块日 K：${okKline.length ? `✅ 可用（${okKline.length}/${report.klines.length} 次探测取到数据；口径 fqt=${fqtUsed.join("/") || "—"}）` : "❌ 未取到任何日线 → 栏目会因「日K接口未返回数据」缺席"}`,
      `样本末收盘日：${lastDates.join(" / ") || "—"}（需与各行业共同收盘日一致，且距今 ≤14 天）`,
      `评分门槛：日线 ≥66 根 → ${okKline.filter((r) => r.count >= 66).length}/${okKline.length} 个样本满足`,
    ];
    document.getElementById("verdict").textContent = lines.join("\n");
    document.getElementById("raw").textContent = JSON.stringify(report, null, 1);

    // 回传一份给沙箱（同源相对路径；失败不影响本页展示）
    try {
      fetch("./collect", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source: "browser", ...report }) });
    } catch (e) { /* 忽略：本页结果已可人工复制 */ }
  }
})();
</script>
</body>
</html>
